"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

file_include_globs = """
.env
.env*.local
.vercel/**
"""

[prompts]
create_pr = """
Delegate to the pr-wizard agent (.claude/agents/pr-wizard/AGENT.md) instead of running git or gh
yourself. If you cannot spawn subagents, read that file and execute its steps.

Commit any uncommitted work first. Base the PR on this workspace's target branch, `main` unless
stated otherwise. Let pr-wizard pick between its PR and stack workflows — anything longer than a
single commit ships as a stack. Report the cut it chose and every PR URL.
"""

[scripts]
setup = "./.conductor/setup.sh"
run_mode = "concurrent"

[scripts.run.web]
command = "pnpm --filter @repo/web dev --port $CONDUCTOR_PORT"
available_in = ["local", "cloud"]
default = true
icon = "play"

[scripts.run.agent]
command = "pnpm agent"
available_in = ["local"]
icon = "terminal"

[scripts.run.checks]
command = "pnpm typecheck && pnpm exec prettier --check ."
available_in = ["local", "cloud"]
icon = "check"
